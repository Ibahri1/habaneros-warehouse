name: Deploy to GitHub Pages

on:
  push:
    branches:
      - github-pages-static

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://ggmnyitasbsndytpbmpl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mXRcKC7W76xLwZAuQXLx7w_pRoQ8FVG
          NEXT_PUBLIC_SUPABASE_URL: https://ggmnyitasbsndytpbmpl.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mXRcKC7W76xLwZAuQXLx7w_pRoQ8FVG

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4